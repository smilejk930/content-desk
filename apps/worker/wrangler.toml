name = "content-desk-worker"
main = "src/index.ts"
compatibility_date = "2026-03-01"

[[d1_databases]]
binding = "DB"
database_name = "content-desk-db"
database_id = "dfa2ebd0-3ac8-44dc-a856-1a6c67725b94"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "content-desk-bucket"

[triggers]
crons = ["0 * * * *"]

# 주의: wrangler deploy 실행 시 아래 [vars]가 Cloudflare 대시보드 설정을 덮어씁니다.
# 첫 배포 시 ALLOWED_ORIGINS에 Pages 프로덕션 출처(예: https://<project>.pages.dev)를 추가하고,
# 오너 최초 1회 로그인 후 확보한 UID는 대시보드가 아니라 반드시 이 파일의 ALLOWED_UIDS에 넣어 재배포하세요.
[vars]
FIREBASE_PROJECT_ID = "content-desk-b9c3d"
ALLOWED_UIDS = "66bOx7EUvXQupsz9tnFSfFvSlJI2"
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173,https://content-desk-f4s.pages.dev"
R2_ACCOUNT_ID = ""
R2_BUCKET_NAME = "content-desk-bucket"
SESSION_MAX_AGE_SECONDS = "1209600"
REAUTH_MAX_AGE_SECONDS = "900"
CLOCK_SKEW_SECONDS = "60"
